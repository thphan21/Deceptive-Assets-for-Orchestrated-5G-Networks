apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: <REDACTED_CA_CERT_BASE64>
    server: https://127.0.0.1:6443
  name: default
contexts:
- context:
    cluster: default
    user: default
  name: default
current-context: default
kind: Config
users:
- name: default
  user:
    client-certificate-data: <REDACTED_CLIENT_CERT_BASE64>
    client-key-data: <REDACTED_CLIENT_PRIVATE_KEY_BASE64>