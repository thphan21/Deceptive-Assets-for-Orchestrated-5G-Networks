# Source: open5gs/charts/upf/templates/configmap-entrypoint.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: open5gs-upf-entrypoint
  labels:
    app.kubernetes.io/name: upf
    helm.sh/chart: upf-2.3.2
    app.kubernetes.io/instance: open5gs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "2.7.5"
data:
  k8s-entrypoint.sh: |
    #!/bin/bash
    set -e
    
    echo "Executing k8s customized entrypoint.sh"
    echo "Creating net device ogstun"
    if grep "ogstun" /proc/net/dev > /dev/null; then
        echo "Warning: Net device ogstun already exists! may you need to set createDev: false";
        exit 1
    fi
    
    ip tuntap add name ogstun mode tun
    ip link set ogstun up
    ip link set dev ogstun txqueuelen 4096
    echo "Setting IP 10.45.0.1 to device ogstun"
    ip addr add 10.45.0.1/16 dev ogstun;
    sysctl -w net.ipv4.ip_forward=1;
    echo "Enable NAT for 10.45.0.0/16 and device ogstun"
    iptables -t nat -A POSTROUTING -s 10.45.0.0/16 ! -o ogstun -j MASQUERADE;
    
    $@
---
# Source: open5gs/charts/upf/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: open5gs-upf
  labels:
    app.kubernetes.io/name: upf
    helm.sh/chart: upf-2.3.2
    app.kubernetes.io/instance: open5gs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "2.7.5"
data:
  upf.yaml: |
    
    
    logger:
      level: info
    #  level: info   # fatal|error|warn|info(default)|debug|trace
    
    global:
    # max:
    #   ue: 1024  # The number of UE can be increased depending on memory size.
    #    peer: 64
    
    upf:
      pfcp:
        server:
        - dev: eth0
        client:
      gtpu:
        server:
        - dev: eth0
      session:
        -
          dev: ogstun
          dnn: internet
          gateway: 10.45.0.1
          subnet: 10.45.0.0/16
    
    ################################################################################
    # PFCP Server
    ################################################################################
    # o Override PFCP address to be advertised to SMF in PFCP association
    #  pfcp:
    #    server:
    #      - dev: eth0
    #        advertise: open5gs-upf.svc.local
    #
    ################################################################################
    # GTP-U Server
    ################################################################################
    #  o Override SGW-U GTP-U address to be advertised inside S1AP messages 
    #  gtpu:
    #    server:
    #      - dev: ens3
    #        advertise: upf1.5gc.mnc001.mcc001.3gppnetwork.org
    #
    #  o User Plane IP Resource information
    #  gtpu:
    #    server:
    #      - address:
    #        - 127.0.0.7
    #        - ::1
    #        teid_range_indication: 4
    #        teid_range: 10
    #        network_instance: internet
    #        source_interface: 0
    #      - address: 127.0.10.4
    #        teid_range_indication: 4
    #        teid_range: 5
    #        network_instance: ims
    #        source_interface: 1
    #
    ################################################################################
    # 3GPP Specification
    ################################################################################
    #
    #  o Specific DNN/APN(e.g 'ims') uses 10.46.0.1/16, 2001:db8:babe::1/48
    #  $ sudo ip addr add 10.45.0.1/16 dev ogstun
    #  $ sudo ip addr add 2001:db8:cafe::1/48 dev ogstun2
    #  $ sudo ip addr add 10.46.0.1/16 dev ogstun3
    #  $ sudo ip addr add 2001:db8:babe::1/48 dev ogstun3
    #
    #  session:
    #    - subnet: 10.45.0.1/16
    #      dnn: internet
    #    - subnet: 2001:db8:cafe::1/48
    #      dnn: internet
    #      dev: ogstun2
    #    - subnet: 10.46.0.1/16
    #      dnn: ims
    #      dev: ogstun3
    #    - subnet: 2001:db8:babe::1/48
    #      dnn: ims
    #      dev: ogstun3
